<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Your House is Ready - HouseGrocer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "surface-container-highest": "#e2e2e5",
                        "inverse-primary": "#70db9d",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#994700",
                        "surface-container-high": "#e8e8ea",
                        "tertiary-fixed": "#dce5e0",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#70db9d",
                        "outline-variant": "#bdcabe",
                        "on-primary-fixed": "#002110",

                        "primary-fixed": "#8df8b7",

                        "on-secondary-container": "#592600",
                        "tertiary": "#565f5c",
                        "on-secondary-fixed": "#321200",
                        "on-primary": "#ffffff",
                        "on-surface": "#1a1c1e",

                        "secondary-container": "#fb7800",
                        "background": "#f9f9fc",

                        "on-surface-variant": "#3e4a41",
                        "outline": "#6e7a70",

                        "on-background": "#1a1c1e",

                        "on-primary-container": "#fdfff9",
                        "surface-variant": "#e2e2e5",
                        "primary": "#006b3f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "margin-desktop": "48px",
                        "base": "4px",
                        "xl": "32px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "numeric-data": ["JetBrains Mono"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["JetBrains Mono"],
                        "body-sm": ["Plus Jakarta Sans"]

                    "fontSize": {
                        "numeric-data": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],

<style type="text/tailwindcss">
        @layer utilities {
            .bg-dotted-pattern {
                background-image: radial-gradient(var(--tw-gradient-stops));
            }
        }
    </style>

<body class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Glow -->
<div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-primary/10 to-transparent pointer-events-none"></div>
<div class="w-full max-w-md mx-auto flex flex-col h-full min-h-screen px-margin-mobile pb-margin-mobile pt-xl relative z-10">
<!-- Progress Indicator (Step 3 of 3) -->
<div class="w-full flex gap-2 mb-xl">
<div class="h-2 flex-1 bg-primary rounded-full opacity-100"></div>
<div class="h-2 flex-1 bg-primary rounded-full opacity-100"></div>
<div class="h-2 flex-1 bg-primary rounded-full opacity-100"></div>
</div>
<div class="flex-1 flex flex-col items-center justify-center">
<!-- Hero Icon -->
<div class="w-24 h-24 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-lg shadow-[0px_12px_32px_rgba(0,107,63,0.2)] animate-bounce" style="animation-duration: 2s; animation-iteration-count: 1;">
<span class="material-symbols-outlined text-display-lg" style="font-variation-settings: 'FILL' 1;">celebration</span>
</div>
<!-- Header Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface text-center mb-sm">Your House is Ready!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mb-xl max-w-[280px]">Invite your housemates to start planning this week's run.</p>
<!-- Invite Code Card (Bento/Ticket Style) -->
<div class="w-full bg-surface-container-lowest border-2 border-dashed border-primary/30 rounded-xl p-lg flex flex-col items-center shadow-[0px_4px_20px_rgba(0,0,0,0.05)] relative overflow-hidden mb-xl">
<!-- Decorative cutouts for ticket look -->
<div class="absolute -left-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-background rounded-full border-r-2 border-dashed border-primary/30"></div>
<div class="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 bg-background rounded-full border-l-2 border-dashed border-primary/30"></div>
<span class="font-label-caps text-label-caps text-primary tracking-widest mb-md opacity-80">HOUSE INVITE CODE</span>
<div class="flex items-center justify-center w-full gap-4 bg-surface-container-low py-4 px-6 rounded-lg border border-surface-variant">
<span class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg tracking-widest text-on-surface font-bold">HG-7B29</span>
</div>
<button class="mt-4 flex items-center gap-2 font-title-md text-title-md text-primary hover:text-primary-container transition-colors" onclick="alert('Code copied to clipboard!')">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
<span>Copy Code</span>
</button>
</div>
</div>
<!-- Sticky Bottom Actions -->
<div class="w-full mt-auto pt-md flex flex-col gap-sm">
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-4 rounded-xl flex items-center justify-center gap-3 hover:bg-surface-tint active:scale-95 transition-all shadow-[0px_4px_20px_rgba(0,107,63,0.3)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span>
                Share on House WhatsApp
            </button>
<button class="w-full bg-transparent text-on-surface-variant font-title-md text-title-md py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-container-low active:scale-95 transition-all mt-2 border border-transparent">
                Go to Dashboard
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
