<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Create House - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#bfc9c4",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-dim": "#dadadc",
                        "primary-container": "#008751",
                        "inverse-surface": "#2f3133",
                        "secondary-fixed": "#ffdbc8",
                        "surface-bright": "#f9f9fc",
                        "on-tertiary-fixed-variant": "#404945",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#ffffff",
                        "surface-container-low": "#f3f3f6",
                        "surface-container-highest": "#e2e2e5",
                        "inverse-primary": "#70db9d",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#994700",
                        "surface-container-high": "#e8e8ea",
                        "tertiary-fixed": "#dce5e0",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#70db9d",
                        "outline-variant": "#bdcabe",
                        "on-primary-fixed": "#002110",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#6f7874",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#ffb68b",
                        "on-tertiary-fixed": "#151d1b",
                        "primary-fixed": "#8df8b7",
                        "on-primary-fixed-variant": "#00522f",
                        "on-secondary-container": "#592600",
                        "tertiary": "#565f5c",
                        "on-secondary-fixed": "#321200",
                        "on-primary": "#ffffff",
                        "on-surface": "#1a1c1e",
                        "on-secondary-fixed-variant": "#753400",
                        "secondary-container": "#fb7800",
                        "background": "#f9f9fc",
                        "surface-container": "#eeeef0",
                        "on-surface-variant": "#3e4a41",
                        "outline": "#6e7a70",
                        "surface-tint": "#006d40",
                        "on-background": "#1a1c1e",
                        "surface": "#f9f9fc",
                        "on-primary-container": "#fdfff9",
                        "surface-variant": "#e2e2e5",
                        "primary": "#006b3f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "margin-desktop": "48px",
                        "base": "4px",
                        "xl": "32px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "numeric-data": ["JetBrains Mono"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["JetBrains Mono"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "numeric-data": ["14px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F0F9F4; /* Surface Level 0 from Style Guidance */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Checkbox Style based on Style Guidance */
        .custom-checkbox input:checked + div {
            background-color: theme('colors.primary');
            border-color: theme('colors.primary');
        }
        .custom-checkbox input:checked + div svg {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-lg text-on-surface">
<!-- Top Navigation (Suppressed per "Linear/Transactional" rule in Shared Components Logic, but replacing with a simple back/close for onboarding if needed. Omitting global nav completely as instructed.) -->
<!-- Header / Progress Area -->
<header class="w-full px-margin-mobile md:px-margin-desktop py-lg flex justify-between items-center bg-surface-container-lowest shadow-sm z-10 sticky top-0">
<div class="flex items-center gap-sm">
<button aria-label="Go Back" class="text-on-surface-variant hover:text-primary transition-colors p-sm rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="font-title-md text-title-md text-primary font-bold tracking-tight">HouseGrocer</div>
</div>
<div class="font-numeric-data text-numeric-data text-on-surface-variant flex items-center gap-sm">
<span class="bg-surface-container-highest px-sm py-xs rounded-lg text-primary">Step 2 of 3</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Decorative background element -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none opacity-40">
<div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-secondary-fixed-dim rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-primary-fixed-dim rounded-full blur-[120px]"></div>
</div>
<div class="w-full max-w-md z-10">
<!-- Content Card (Surface Level 1) -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-surface-container-highest p-xl">
<div class="mb-xl text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Set up your House</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Give your shared space a name and choose when you want groceries delivered.</p>
</div>
<form class="space-y-xl" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- House Name Input -->
<div class="space-y-sm">
<label class="block font-title-md text-title-md text-on-surface" for="houseName">House Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">home</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface-container-low border-none rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all min-h-[48px]" id="houseName" name="houseName" placeholder="e.g., Green House" required="" type="text">
</div>
</div>
<!-- Delivery Day Selection -->
<div class="space-y-sm">
<div class="flex justify-between items-baseline mb-sm">
<label class="block font-title-md text-title-md text-on-surface">Preferred Delivery Day</label>
<span class="font-body-sm text-body-sm text-on-surface-variant">Weekly</span>
</div>
<div class="grid grid-cols-2 gap-md md:grid-cols-4">
<!-- Mon -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" required="" type="radio" value="monday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    MON
                                </div>
</label>
<!-- Tue -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" type="radio" value="tuesday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    TUE
                                </div>
</label>
<!-- Wed -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" type="radio" value="wednesday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    WED
                                </div>
</label>
<!-- Thu -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" type="radio" value="thursday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    THU
                                </div>
</label>
<!-- Fri -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" type="radio" value="friday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    FRI
                                </div>
</label>
<!-- Sat -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" type="radio" value="saturday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    SAT
                                </div>
</label>
<!-- Sun -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="deliveryDay" type="radio" value="sunday">
<div class="w-full text-center py-sm border border-outline-variant rounded-lg peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container hover:bg-surface-container-high transition-colors font-label-caps text-label-caps text-on-surface-variant">
                                    SUN
                                </div>
</label>
</div>
<p class="font-body-sm text-body-sm text-outline mt-sm flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">info</span>
                            Orders lock 24 hours before delivery.
                        </p>
</div>
<!-- Actions -->
<div class="pt-md mt-xl border-t border-surface-container-highest">
<button class="w-full min-h-[48px] bg-secondary-container text-on-tertiary-container font-title-md text-title-md rounded-lg flex items-center justify-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-sm" type="submit">
                            Create House
                            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</main>
</body></html>
